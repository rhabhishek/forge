# Generated by `pod workflows`. Role: __TITLE__ (__ROLE__).
# Edit the template in Forge, not this file.
name: pod-__ROLE__

on:
  workflow_dispatch:
    inputs:
      packet:
        description: Handoff packet for the __ROLE__ role
        required: false
        default: 'Heartbeat: no handoff. Sweep for lost handoffs, then do standing work.'
__SCHEDULE__

# Least privilege: enough to push a branch and comment. Merging stays human.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pod-__ROLE__-${{ github.run_id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every pod path is relative to the repository root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @github/copilot
      - name: Run the __ROLE__ role
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          POD_PACKET: ${{ inputs.packet || 'Heartbeat: no handoff. Sweep for lost handoffs, then do standing work.' }}
        run: printf '%s' "$POD_PACKET" | node __POD_CLI__ handoff __ROLE__ --packet - --foreground
